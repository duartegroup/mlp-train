version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.12"
  commands:
    - curl -fsSL https://pixi.sh/install.sh | bash
    # CONDA_OVERRIDE_CUDA: the docs env includes the mace feature, whose lock
    # pins CUDA builds; this lets them install on the GPU-less RTD builder.
    - CONDA_OVERRIDE_CUDA=12.0 ~/.pixi/bin/pixi run -e docs sphinx-build docs $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py

# Optionally build your docs in additional formats such as PDF and ePub
# formats:
#    - pdf
#    - epub
