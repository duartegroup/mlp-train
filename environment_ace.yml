# Usage: mamba env create -n myenvname -f environment_ace.yml
---
name: mlptrain-ace
channels:
  - conda-forge
dependencies:
  - python=3.10
  - libgfortran=14.*
  - pip
  - ase=3.27.0
  - autode=1.4.5
  - coloredlogs
  - cython
  - dscribe=2.0
  - matplotlib-base
  - numpy<2
  - plumed<2.10
  - py-plumed
  - scipy
  - xtb
  - scikit-learn
  - seaborn
  - pip:
    - julia   # Python-Julia integration (this will not install Julia itself!)
    - pyjulip@git+https://github.com/casv2/pyjulip.git@72280a6ac3 # Integration with ACE
