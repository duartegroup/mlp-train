name: "Lint"

on:
  push:
    branches: [main]
  pull_request:


env:
  FORCE_COLOR: 1

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    # The pixi lock pins CUDA builds (system-requirements cuda = "12"); this lets
    # them install on the GPU-less runner so the `ty` type checker has its deps.
    env:
      CONDA_OVERRIDE_CUDA: "12.0"

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # We need the project dependencies installed for the `ty` type checker.
      # For now, we install the mace environment, as that's the most important one.
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: mace
          # As of Sep 2026, caching on GitHub is actually slower :-(
          cache: false

      - name: Run pre-commit
        run: pixi run -e mace pre-commit run --all-files || ( git status --short ; git diff ; exit 1 )
        env:
          SKIP: 'no-commit-to-branch'
