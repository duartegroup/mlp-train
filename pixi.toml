[workspace]
name = "mlp-train"
channels = ["conda-forge", "pytorch"]
platforms = [
            {name = "linux-64-cpu", platform = "linux-64"},
            {name = "linux-64-cuda", platform = "linux-64", cuda = "12.0"},
            {platform = "osx-arm64"}
            ]


# --- MACE feature: conda dependencies (from environment_mace.yml) ---
[feature.mace.dependencies]
python = "3.10.*"
pip = "*"
libgfortran = "14.*"
ase = "3.23.*"
autode = "1.4.5.*"
coloredlogs = "*"
cython = "*"
dscribe = "2.0.*"
matplotlib-base = ">=3.9.0"
numpy = "*"
plumed = "<2.10"
py-plumed = "*"
scipy = "*"
xtb = "*"
scikit-learn = "*"
openmm = "8.1.2.*"
openmm-torch = "1.4.*"
nnpops = "*"
openmm-ml = "1.2.*"
git = "*"
seaborn = "*"

# --- MACE feature: PyPI dependencies (from the pip: block) ---
# NOTE: the original environment_mace.yml pip-installed an ASE fork
# (gitlab.com/ase/ase@f2615a6e9a, v3.23.0b1) "for PLUMED", force-overwriting
# conda's ase. pixi/uv require a coherent solve, and that beta fork is not on
# conda-forge, so we use conda's ase instead (the fork's PLUMED fixes are
# upstream by ase 3.28). PLUMED support is verified by the test suite.
[feature.mace.pypi-dependencies]
mace-torch = "==0.3.10"
# Install the project itself, editable (replaces `pip install -e .`).
mlptrain = { path = ".", editable = true }

[feature.cueq-cu11]
platforms = ["linux-64-cuda"]

[feature.cueq-cu11.pypi-dependencies]
cuequivariance = "==0.1.0"
cuequivariance-torch = "==0.1.0"
cuequivariance-ops-torch-cu11 = "==0.1.0"

# --- dev tooling (was the `dev` dependency-group in pyproject.toml) ---
[feature.dev.dependencies]
pre-commit = ">=3.6"
pytest = "~=8.0"
pytest-cov = "~=5.0"

[feature.dev.pypi-dependencies]
ty = "==0.0.28"

# --- docs (was [project.optional-dependencies].docs in pyproject.toml) ---
[feature.docs.pypi-dependencies]
sphinx = "~=7.4.7"
sphinx-copybutton = "~=0.5.2"
sphinx-rtd-theme = "~=3.0.2"

[environments]
mace-cpu = ["mace", "dev"]
mace = ["mace", "dev", "cueq-cu11"]
docs = ["mace", "docs"]

[tasks]
test = "pytest tests"
docs = "sphinx-build docs docs/_build/html"
