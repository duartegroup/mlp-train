# Usage: mamba env create -n myenvname -f environment_mace.yml
---
name: mlptrain-mace
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.10
  - ase=3.28.*
  - pip
  - libgfortran=14.*
  - autode=1.4.5
  - coloredlogs
  - cython
  - dscribe=2.0
  - matplotlib-base>=3.9.0
  - numpy
  - py-plumed
  - plumed<2.10
  - scipy
  - xtb
  - scikit-learn
  - openmm=8.1.2
  - openmm-torch=1.4
  - nnpops
  - openmm-ml=1.2
  - git
  - seaborn
  - pip:
    - mace-torch==0.3.10
    - cuequivariance==0.1.0
    - cuequivariance-torch==0.1.0
    - cuequivariance-ops-torch-cu11==0.1.0
